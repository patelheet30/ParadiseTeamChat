name: Build and Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Extract version from pom.xml
        id: get_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Plugin version: $VERSION"
      
      - name: Build with Maven
        run: mvn clean package
      
      - name: Verify JAR was created
        run: |
          if [ ! -f "target/ParadiseTeamChat-${{ steps.get_version.outputs.VERSION }}.jar" ]; then
            echo "ERROR: JAR file not found!"
            exit 1
          fi
          echo "JAR file found: ParadiseTeamChat-${{ steps.get_version.outputs.VERSION }}.jar"
      
      - name: Upload JAR to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/ParadiseTeamChat-${{ steps.get_version.outputs.VERSION }}.jar
            src/main/resources/config.yml
            README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload artifact for workflow run
        uses: actions/upload-artifact@v4
        with:
          name: ParadiseTeamChat-${{ steps.get_version.outputs.VERSION }}
          path: target/ParadiseTeamChat-${{ steps.get_version.outputs.VERSION }}.jar
          retention-days: 30