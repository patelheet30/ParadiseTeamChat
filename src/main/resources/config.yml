# ParadiseTeamChat Plugin Configuration

# Team settings
team:
  max-members: 10               # Maximum number of members per team
  max-name-length: 16           # Maximum length of team names
  max-tag-length: 4             # Maximum length of team tags
  name-regex: '^[A-Za-z0-9_]+$' # Regex for valid team names (only alphanumeric)
  tag-regex: '^[A-Za-z0-9]+$'   # Regex for valid team tags (only alphanumeric)
  allow-editing: true           # Whether team owners can edit team name and tag

# Blacklisted words (names and tags)
blacklist:
  banned-words:
    - "admin"
    - "moderator"
    - "staff"
    - "owner"
    - "server"
    - "mod"
    - "helper"
    - "support"
    - "unknown"
    - "team"
    - "guild"
    - "paradise"
    - "chat"
    - "null"
    - "teamchat"
    - "ptc"
    - "paradiseteamchat"
    - "globalchat"
    - "tc"
    - "gc"
  case-sensitive: false         # Whether the blacklist is case-sensitive (if false, "Admin" matches "admin")

performance:
  async-operations: true        # Whether to perform database operations asynchronously (recommended for performance)
  cache-cleanup-delay: 60       # How often to cleanup cache (seconds)
  chat-integration-mode: false  # false = override chat (default), true = integrate with existing chat plugins
  debug-mode: false             # Enable debug mode for more detailed logging

# Team exclusive block effects
team-blocks:
  enabled: true                 # Enable team-exclusive block effects
  supported-blocks:             # List of blocks that have team-exclusive effects
    - BEACON
    - CONDUIT
  notify-placement: true        # Notify team members when a team block is placed
  notify-effect-blocked: false  # Notify when a non-team member tries to use a team block (debug)

# ===============================
# ROLE SYSTEM CONFIGURATION
# ===============================
roles:
  enabled: true                 # Enable the role system

  # Owner Role (cannot be changed) (Always required)
  owner:
    display-name: "Owner"
    colour: "&6"
  
  # Define additional sub-roles below
  # Each role needs: display-name, colour, permissions
  
  sub-roles:
    moderator:
      display-name: "Moderator"
      colour: "&e"
      permissions:
        invite: true
        kick: true
        promote: true
        demote: true
        edit-team: false
    
    member:
      display-name: "Member"
      colour: "&7"
      permissions:
        invite: false
        kick: false
        promote: false
        demote: false
        edit-team: false

# Message configurations
messages:
  prefix: "&8[&bPTC&8]&r "
  
  # Success messages
  team-created: "&aTeam created successfully!"
  team-disbanded: "&aTeam disbanded."
  player-invited: "&aInvite sent to &e{player}&a."
  invite-received: "&aYou've been invited to join &e{team}&a! Use &6/team accept&a to join."
  player-joined: "&e{player}&a joined the team!"
  player-kicked: "&e{player}&a has been kicked from the team."
  player-left: "&aYou left the team."
  
  # Error messages
  no-permission: "&cYou don't have permission to use this command."
  already-in-team: "&cYou are already in a team!"
  not-in-team: "&cYou are not in a team."
  team-not-found: "&cTeam '&e{team}&c' not found."
  player-not-found: "&cPlayer '&e{player}&c' is not online."
  team-full: "&cThat team is full!"
  not-owner: "&cOnly the team owner can do that."
  invalid-name: "&cInvalid team name. Use only letters and numbers."
  invalid-tag: "&cInvalid team tag. Use only letters and numbers."
  name-too-long: "&cTeam name is too long (max {max} characters)."
  tag-too-long: "&cTeam tag is too long (max {max} characters)."
  banned-word: "&cThat word is not allowed in team names."
  team-exists: "&cA team with that name or tag already exists."
  no-pending-invite: "&cYou don't have any pending invites."
  cannot-invite-self: "&cYou cannot invite yourself!"
  already-invited: "&cThat player already has a pending invite."
  editing-disabled: "&cTeam editing is currently disabled by the server."
  
  # Info messages
  chat-mode-team: "&aTeam chat mode &eenabled&a."
  chat-mode-global: "&aTeam chat mode &cdisabled&a."
  config-reloaded: "&aConfiguration reloaded!"
  
  # Role system messages
  role-promoted: "&e{player}&a has been promoted to {role}&a!"
  role-demoted: "&e{player}&a has been demoted to &7Member&a."
  role-info: "&e{player}&7 is a {role}"
  role-not-found: "&cRole '&e{role}&c' does not exist."
  cannot-promote-owner: "&cYou cannot change the owner's role!"
  cannot-demote-owner: "&cYou cannot demote the owner!"
  already-has-role: "&e{player}&c already has that role."
  no-promote-permission: "&cYou don't have permission to promote members."
  no-demote-permission: "&cYou don't have permission to demote members."
  no-invite-permission: "&cYou don't have permission to invite players."
  no-kick-permission: "&cYou don't have permission to kick members."
  no-edit-permission: "&cYou don't have permission to edit the team."
  cannot-kick-owner: "&cYou cannot kick the team owner!"
  cannot-promote-to-owner: "&cYou cannot promote anyone to owner!"
  roles-disabled: "&cThe role system is currently disabled."
