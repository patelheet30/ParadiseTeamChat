name: TeamChat
version: 1.0.0
main: com.patelheet.teamchat.TeamChatPlugin
description: High-performance team communication plugin for Paper servers
authors:
  - Heet Patel
website: https://github.com/patelheet30/teamchat

api-version: '1.21'
loader: PAPER


commands:
  team:
    description: Manage your team
    usage: /team <create|disband|invite|kick|accept|leave|info|help>
    aliases:
      - t
    permission: teamchat.team.use
    
  teamchat:
    description: Toggle team chat or send a quick message
    usage: /teamchat [message]
    aliases:
      - tc
    permission: teamchat.chat.team
    
  globalchat:
    description: Switch to global chat or send a quick message
    usage: /globalchat [message]
    aliases:
      - gc
    
  teamadmin:
    description: Admin commands for managing teams
    usage: /teamadmin <delete|info|list|reload> [args]
    aliases:
      - ta
    permission: teamchat.admin

permissions:
  teamchat.team.use:
    description: Allows using basic team commands
    default: "true"
    
  teamchat.team.create:
    description: Allows creating a new team
    default: "true"
    
  teamchat.team.disband:
    description: Allows disbanding your own team
    default: "true"
    
  teamchat.team.invite:
    description: Allows inviting players to your team
    default: "true"
    
  teamchat.team.kick:
    description: Allows kicking players from your team
    default: "true"
    
  teamchat.chat.team:
    description: Allows using team chat
    default: "true"
    
  teamchat.admin:
    description: Allows using admin commands
    default: op
    children:
      - teamchat.team.use
      - teamchat.team.create
      - teamchat.team.disband
      - teamchat.team.invite
      - teamchat.team.kick
      - teamchat.chat.team