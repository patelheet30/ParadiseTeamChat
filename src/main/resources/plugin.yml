name: ParadiseTeamChat
version: 3.0.0
main: com.patelheet.paradiseteamchat.ParadiseTeamChatPlugin
description: High-performance team communication plugin for Paper servers
api-version: '1.21'
authors: [Heet Patel]
website: https://github.com/patelheet30/ParadiseTeamChat
softdepend: [PlaceholderAPI, squaremap]

commands:
  team:
    description: Manage your team
    usage: /team <create|disband|invite|kick|accept|leave|info|edit|help>
    aliases: [t]
    
  teamchat:
    description: Toggle team chat or send a quick message
    usage: /teamchat [message]
    aliases: [tc]
    
  globalchat:
    description: Switch to global chat or send a quick message
    usage: /globalchat [message]
    aliases: [gc]
    
  teamadmin:
    description: Admin commands for managing teams
    usage: /teamadmin <delete|info|list|reload> [args]
    aliases: [ta]

permissions:
  teamchat.team.use:
    description: Allows using basic team commands
    default: true
    
  teamchat.team.create:
    description: Allows creating a new team
    default: true
    
  teamchat.team.disband:
    description: Allows disbanding your own team
    default: true
    
  teamchat.team.invite:
    description: Allows inviting players to your team
    default: true
    
  teamchat.team.kick:
    description: Allows kicking players from your team
    default: true

  teamchat.team.edit:
    description: Allows editing team name and tag
    default: true

  teamchat.team.promote:
    description: Allows promoting team members to roles
    default: true

  teamchat.team.demote:
    description: Allows demoting team members from roles
    default: true

  teamchat.chat.team:
    description: Allows using team chat
    default: true
    
  teamchat.admin:
    description: Allows using admin commands
    default: op
    children:
      teamchat.team.use: true
      teamchat.team.create: true
      teamchat.team.disband: true
      teamchat.team.invite: true
      teamchat.team.kick: true
      teamchat.chat.team: true
      teamchat.team.edit: true
      teamchat.team.promote: true
      teamchat.team.demote: true